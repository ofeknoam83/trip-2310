<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IMA קשר</title>
  <meta name="description" content="קשר בין מוקד IMA לצוות הרפואי">
  <meta name="theme-color" content="#0d1014">
  <link rel="manifest" href="/ima/manifest.webmanifest">
  <link rel="icon" href="/ima/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/ima/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ima/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img class="logo" src="https://www.imaisrael.co.il/wp-content/uploads/2023/07/IMA-logogif.gif" alt="IMA" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo-text',textContent:'IMA'}))">
      <span class="brand-sub">קשר מוקד</span>
    </div>
    <div class="top-right">
      <span class="pill" id="conn">לא מחובר</span>
      <button class="me" id="me-btn" aria-label="המשתמש שלי"></button>
    </div>
  </header>

  <main>
    <section class="channel" id="channel" aria-live="polite">
      <div class="ch-idle">
        <span class="ch-dot"></span>
        <div><b>ערוץ פנוי</b><small id="ch-count">אף אחד לא מחובר</small></div>
      </div>
    </section>

    <section class="ptt-wrap">
      <button class="ptt" id="ptt" disabled>
        <span class="ptt-label" id="ptt-label">התחברות לקשר</span>
        <span class="ptt-hint" id="ptt-hint">לחיצה אחת כדי להתחיל</span>
      </button>
      <div class="ptt-tools">
        <button class="tool" id="wake" aria-pressed="false">מסך דלוק</button>
        <button class="tool" id="leave" hidden>ניתוק</button>
      </div>
    </section>

    <section class="block">
      <div class="block-head"><h2>מחוברים לערוץ</h2><span class="count" id="online-n">0</span></div>
      <div class="roster" id="online"></div>
    </section>

    <section class="block">
      <div class="block-head"><h2>שידורים אחרונים</h2></div>
      <ol class="log" id="log"><li class="empty">עוד לא היו שידורים מאז שהתחברת.</li></ol>
    </section>
  </main>

  <div id="sheet-root"></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
  <script type="module" src="/ima/app.js"></script>
</body>
</html>
